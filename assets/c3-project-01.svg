<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%" height="100%">
  <defs>
    <linearGradient id="proj1Bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="screenGrad1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <filter id="dashDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="rgba(15,23,42,0.12)"/>
    </filter>
  </defs>

  <rect width="400" height="280" fill="url(#proj1Bg)"/>

  <!-- 노트북 / 모니터 화면 본체 -->
  <rect x="35" y="25" width="330" height="200" rx="8" fill="url(#screenGrad1)" stroke="#0F172A" stroke-width="5" filter="url(#dashDrop)"/>
  
  <!-- 상단 브라우저 바 -->
  <rect x="35" y="25" width="330" height="24" rx="8" fill="#E2E8F0"/>
  <circle cx="50" cy="37" r="4" fill="#EF4444"/>
  <circle cx="62" cy="37" r="4" fill="#F59E0B"/>
  <circle cx="74" cy="37" r="4" fill="#10B981"/>
  <rect x="110" y="31" width="180" height="12" rx="4" fill="#FFFFFF"/>
  <text x="200" y="40" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="8" fill="#64748B">data-analytics-dashboard.kpi</text>

  <!-- 대시보드 위젯 1: 성장률 KPI 카드 -->
  <g transform="translate(55, 62)">
    <rect x="0" y="0" width="85" height="50" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
    <text x="10" y="18" font-family="sans-serif" font-weight="700" font-size="9" fill="#1E40AF">전환율 개선</text>
    <text x="10" y="38" font-family="sans-serif" font-weight="900" font-size="16" fill="#1D4ED8">+35.4%</text>
    <path d="M 60 38 L 72 26 L 68 26 M 72 26 L 72 30" stroke="#10B981" stroke-width="2" fill="none"/>
  </g>

  <!-- 대시보드 위젯 2: 비용 절감 KPI 카드 -->
  <g transform="translate(150, 62)">
    <rect x="0" y="0" width="85" height="50" rx="6" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
    <text x="10" y="18" font-family="sans-serif" font-weight="700" font-size="9" fill="#065F46">운영비용 절감</text>
    <text x="10" y="38" font-family="sans-serif" font-weight="900" font-size="15" fill="#047857">-28.0%</text>
  </g>

  <!-- 대시보드 위젯 3: 상태 뱃지 -->
  <g transform="translate(245, 62)">
    <rect x="0" y="0" width="100" height="50" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
    <text x="10" y="18" font-family="sans-serif" font-weight="700" font-size="9" fill="#475569">프로젝트 성과</text>
    <rect x="10" y="26" width="75" height="16" rx="4" fill="#1B4DF5"/>
    <text x="47" y="38" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="9" fill="#FFFFFF">TARGET ACHIEVED</text>
  </g>

  <!-- 메인 데이터 막대 차트 -->
  <g transform="translate(55, 125)">
    <rect x="0" y="0" width="290" height="85" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <!-- 차트 가이드 라인 -->
    <line x1="20" y1="20" x2="270" y2="20" stroke="#F1F5F9" stroke-width="1"/>
    <line x1="20" y1="45" x2="270" y2="45" stroke="#F1F5F9" stroke-width="1"/>
    <line x1="20" y1="70" x2="270" y2="70" stroke="#CBD5E1" stroke-width="1.5"/>
    <!-- 막대들 -->
    <rect x="35" y="48" width="18" height="22" rx="3" fill="#93C5FD"/>
    <rect x="65" y="40" width="18" height="30" rx="3" fill="#93C5FD"/>
    <rect x="95" y="32" width="18" height="38" rx="3" fill="#60A5FA"/>
    <rect x="125" y="28" width="18" height="42" rx="3" fill="#60A5FA"/>
    <rect x="155" y="22" width="18" height="48" rx="3" fill="#3B82F6"/>
    <rect x="185" y="15" width="18" height="55" rx="3" fill="#2563EB"/>
    <rect x="215" y="10" width="18" height="60" rx="3" fill="#1D4ED8"/>
    <rect x="245" y="5" width="18" height="65" rx="3" fill="#1B4DF5"/>
  </g>

  <!-- 노트북 스탠드 바닥 -->
  <path d="M 160 225 L 240 225 L 255 240 L 145 240 Z" fill="#CBD5E1" stroke="#0F172A" stroke-width="4"/>
  <line x1="120" y1="240" x2="280" y2="240" stroke="#0F172A" stroke-width="5" stroke-linecap="round"/>
</svg>

